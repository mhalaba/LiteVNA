[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litevna-studio"
version = "1.0.0"
description = "Full-featured LiteVNA desktop application for macOS with antenna presets (PL/EN)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LiteVNA Studio" }]
dependencies = [
  "PySide6>=6.6.0",
  "pyqtgraph>=0.13.3",
  "pyserial>=3.5",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-qt>=4.2.0"]

[project.scripts]
litevna-studio = "litevna.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litevna = ["i18n/*.json", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
